# docker compose(MySQL 3307, Redis 6379)로 실행: ./gradlew bootRun --args='--spring.profiles.active=docker'
spring:
  datasource:
    url: jdbc:mysql://localhost:3307/bankflow
    username: bankflow
    password: bankflow

  jpa:
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379

bankflow:
  lock:
    strategy: redis
  idempotency:
    enabled: true
