# 부하 테스트·Redis 기능용 로컬 인프라: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: bankflow-mysql
    environment:
      MYSQL_DATABASE: bankflow
      MYSQL_USER: bankflow
      MYSQL_PASSWORD: bankflow
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: bankflow-redis
    ports:
      - "6379:6379"
